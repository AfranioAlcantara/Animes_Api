openapi: 3.0.0
info:
  title: Anime Characters API
  version: 1.0.0
  description: API para listar personagens de animes

servers:
  - url: localhost:3000/api-docs/#/Personagens/get_api_characters__id_
    description: Servidor de produção (Railway)

paths:
  /api/characters:
    get:
      summary: Lista todos os personagens
      responses:
        '200':
          description: Lista de personagens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'

  /api/characters/{id}:
    get:
      summary: Busca um personagem pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do personagem
          schema:
            type: integer
      responses:
        '200':
          description: Personagem encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '404':
          description: Personagem não encontrado

components:
  schemas:
    Character:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        anime:
          type: string
